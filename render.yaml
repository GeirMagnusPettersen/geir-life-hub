# Render.com blueprint for Geir Life Hub.
#
# NOTE: Render requires credit card verification before it will create a
# Web Service, even on the $0/month Free compute plan. This was verified
# live (Nov 2025) for an individually-created service ("New +" ->
# "Web Service", not Blueprint) on a real account, for BOTH the Docker
# runtime and the native Python 3 runtime -- the "Add Card" prompt appeared
# either way as soon as "Deploy web service" was clicked. This contradicts
# an earlier assumption (recorded in README.md history) that manually-
# created services bypass the card gate; that assumption was wrong and has
# been corrected there. Card-free Postgres (Neon.tech) is unaffected --
# only Render's compute (Web Service / Blueprint) requires the card.
#
# The card verification is a $1 USD temporary authorization, not a charge,
# per Render's own modal copy. If you're fine adding a card for that
# verification step while staying on the $0/month plan, this Blueprint (or
# the manual Web Service flow) works fine. If you want to avoid ever
# entering a card, see README.md's "Lokal utvikling" / Docker Compose
# section for self-hosting on your own machine/VPS instead.
#
# This is an *alternative* to the Docker Compose self-hosting path in
# docker-compose.yml, for the case where you'd rather have the app built and
# run on a managed cloud platform instead of a machine you operate yourself.
# Render builds natively from source (no Dockerfile required) and provisions
# a managed Postgres instance alongside the services below.
#
# Usage: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repository. Render reads this
# file and creates the database + both services automatically.
databases:
  - name: lifehub-postgres
    databaseName: lifehub
    user: lifehub
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: lifehub-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifehub-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: MIN_PASSWORD_LENGTH
        value: "10"
      - key: CORS_ORIGINS
        # Set this to your frontend's Render URL after first deploy, e.g.
        # https://lifehub-frontend.onrender.com (comma-separate multiple origins).
        sync: false
      # KitchenOwl adapter is optional; leave unset to run without it
      # (integration endpoints respond 503 instead of failing hard).
      - key: KITCHENOWL_BASE_URL
        sync: false
      - key: KITCHENOWL_USERNAME
        sync: false
      - key: KITCHENOWL_PASSWORD
        sync: false
      - key: KITCHENOWL_HOUSEHOLD_ID
        sync: false

  - type: web
    name: lifehub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        # Set this to your backend's Render URL after first deploy, e.g.
        # https://lifehub-backend.onrender.com
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
