# Render.com blueprint for Geir Life Hub.
#
# NOTE: Render requires credit card verification before it will create
# resources via the Blueprint flow (this one) or its own managed Postgres,
# even on the free plan. Individually-created Web Services / Static Sites
# ("New +" -> "Web Service"/"Static Site", not "Blueprint") do NOT require a
# card. If you want a fully card-free free-tier deploy, follow the manual
# step-by-step instructions in README.md ("Kom i gang (skyhosting, helt
# gratis og uten kredittkort)") instead, which creates the two services by
# hand and uses Neon.tech for Postgres. This file is kept as a reference/
# shortcut for anyone who doesn't mind verifying a card with Render.
#
# This is an *alternative* to the Docker Compose self-hosting path in
# docker-compose.yml, for the case where you'd rather have the app built and
# run on a managed cloud platform instead of a machine you operate yourself.
# Render builds natively from source (no Dockerfile required) and provisions
# a managed Postgres instance alongside the services below.
#
# Usage: push this repo to GitHub, then in the Render dashboard choose
# "New +" -> "Blueprint" and point it at this repository. Render reads this
# file and creates the database + both services automatically.
databases:
  - name: lifehub-postgres
    databaseName: lifehub
    user: lifehub
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: lifehub-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lifehub-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: SESSION_SECRET_KEY
        generateValue: true
      - key: MIN_PASSWORD_LENGTH
        value: "10"
      - key: CORS_ORIGINS
        # Set this to your frontend's Render URL after first deploy, e.g.
        # https://lifehub-frontend.onrender.com (comma-separate multiple origins).
        sync: false
      # KitchenOwl adapter is optional; leave unset to run without it
      # (integration endpoints respond 503 instead of failing hard).
      - key: KITCHENOWL_BASE_URL
        sync: false
      - key: KITCHENOWL_USERNAME
        sync: false
      - key: KITCHENOWL_PASSWORD
        sync: false
      - key: KITCHENOWL_HOUSEHOLD_ID
        sync: false

  - type: web
    name: lifehub-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        # Set this to your backend's Render URL after first deploy, e.g.
        # https://lifehub-backend.onrender.com
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
