version: "3.9"

services:
  db:
    image: postgres:16.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lifehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-lifehub}
    volumes:
      - lifehub_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lifehub} -d ${POSTGRES_DB:-lifehub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-lifehub}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lifehub}}
      SESSION_SECRET_KEY: ${SESSION_SECRET_KEY:?Set SESSION_SECRET_KEY in .env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-lifehub_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-720}
      MIN_PASSWORD_LENGTH: ${MIN_PASSWORD_LENGTH:-10}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      KITCHENOWL_BASE_URL: ${KITCHENOWL_BASE_URL:-}
      KITCHENOWL_USERNAME: ${KITCHENOWL_USERNAME:-}
      KITCHENOWL_PASSWORD: ${KITCHENOWL_PASSWORD:-}
      KITCHENOWL_HOUSEHOLD_ID: ${KITCHENOWL_HOUSEHOLD_ID:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-https://api.openai.com/v1}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-gpt-4o-mini}
      ASSISTANT_VISION_MODEL: ${ASSISTANT_VISION_MODEL:-meta-llama/llama-4-scout-17b-16e-instruct}
      # Optional: route image-bearing chat turns to a different provider
      # than ASSISTANT_BASE_URL (e.g. the self-hosted Ollama service below),
      # while text turns keep using the main provider. Both default to the
      # main ASSISTANT_* values when left blank.
      ASSISTANT_VISION_BASE_URL: ${ASSISTANT_VISION_BASE_URL:-}
      ASSISTANT_VISION_API_KEY: ${ASSISTANT_VISION_API_KEY:-}
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        # Baked into the static build at build time (Vite inlines VITE_*
        # vars), so the browser's JS calls the backend directly at this
        # origin. Must match where the backend is actually reachable from
        # the user's browser - override via .env for non-localhost deploys.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  # Optional: self-hosted Ollama instance providing a free, local vision
  # model for meal-photo chat (ASSISTANT_VISION_BASE_URL=http://ollama:11434/v1
  # in .env), so image-based chat works with no signup/paid vision API
  # required. Text chat keeps using ASSISTANT_BASE_URL (Groq by default)
  # regardless of this service. Only started when the `vision` profile is
  # enabled (opt-in: `docker compose --profile vision up -d ollama`, see
  # README), since the image is 900MB+. First run: pull a model with
  # `docker compose exec ollama ollama pull moondream` (see README).
  ollama:
    image: ollama/ollama:0.40.0
    restart: unless-stopped
    profiles: ["vision"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  # Optional: self-hosted KitchenOwl instance (recipes/shopping list), only
  # started when the `kitchenowl` profile is enabled (see .env.example).
  # kitchenowl-backend's own port speaks raw uWSGI, not HTTP - the Life Hub
  # backend's KITCHENOWL_BASE_URL must point at kitchenowl-frontend below
  # (nginx, which reverse-proxies /api/* to this service over HTTP).
  kitchenowl-backend:
    image: tombursch/kitchenowl-backend:v0.7.10
    restart: unless-stopped
    profiles: ["kitchenowl"]
    environment:
      JWT_SECRET_KEY: ${KITCHENOWL_JWT_SECRET_KEY:?Set KITCHENOWL_JWT_SECRET_KEY in .env}
    volumes:
      - kitchenowl_data:/data
    ports:
      - "5001:5000"

  kitchenowl-frontend:
    image: tombursch/kitchenowl-web:v0.7.10
    restart: unless-stopped
    profiles: ["kitchenowl"]
    environment:
      BACK_URL: kitchenowl-backend:5000
    depends_on:
      - kitchenowl-backend
    ports:
      - "5002:80"

volumes:
  lifehub_postgres_data:
  kitchenowl_data:
  ollama_data:
